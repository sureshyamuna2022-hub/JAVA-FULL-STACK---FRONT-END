<!DOCTYPE html>
<html>
<head>
    <title>CSS Forms</title>

    <style>

        *{
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background-color: #f2f2f2;
            padding: 40px;
        }

        .container{
            border-radius: 5px;
            background-color: #f2f2f2;
            padding: 20px;
            width: 60%;
            margin: auto;
            border: 1px solid #ccc;
        }

        .row{
            margin-bottom: 15px;
        }

        .col-25{
            float: left;
            width: 25%;
            margin-top: 6px;
        }

        .col-75{
            float: left;
            width: 75%;
            margin-top: 6px;
        }

        .inpEle{
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .frmLabel{
            padding: 12px 12px 12px 0;
            display: inline-block;
        }

        .btnSubmit{
            background-color: #4CAF50;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            float: right;
        }

        .btnSubmit:hover{
            background-color: #45a049;
        }

        .row::after{
            content: "";
            display: table;
            clear: both;
        }

    </style>
</head>

<body>

    <h2>CSS - Forms</h2>

    <div class="container">

        <div class="row">

            <div class="col-25">
                <label class="frmLabel" for="fname">
                    First Name
                </label>
            </div>

            <div class="col-75">
                <input type="text"
                       id="fname"
                       class="inpEle"
                       name="firstname"
                       placeholder="Your name..">
            </div>

        </div>

        <div class="row">

            <div class="col-25">
                <label class="frmLabel" for="lname">
                    Last Name
                </label>
            </div>

            <div class="col-75">
                <input type="text"
                       id="lname"
                       class="inpEle"
                       name="lastname"
                       placeholder="Your last name..">
            </div>

        </div>

        <div class="row">
            <input type="submit"
                   value="Submit"
                   class="btnSubmit">
        </div>

    </div>

</body>
</html>
