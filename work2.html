<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Bakery</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>


    <style>
        .hero {
            background: #f8d7da;
            padding: 80px 20px;
            text-align: center;
        }

        .card img {
            
            height: 200px;
            object-fit: cover;
        }

        footer {
            background: #343a40;
            color:#f8d7da ;
            padding: 15px;
            text-align: center;
        } 

      
    
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Sweet Bakery</a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#Home">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#Products">Products</a></li>
                    <li class="nav-item"><a class="nav-link" href="#About">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="#Contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to Sweet Bakery</h1>
        <p>Fresh Cakes, Breads & Pastries Every Day</p>
        <button class="btn btn-danger">Order Now</button>
    </section>

    <!-- Products -->
    <div class="container my-5">
        <h2 class="text-center mb-4">Our Products</h2>

        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <img src="./Assets/chocolate cake.jpeg" class="card-img-top" alt="Cake">
                    <div class="card-body text-center">
                        <h5>Chocolate Cake</h5>
                        <p>₹500</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <img src="./Assets/frish bread.jpeg" class="card-img-top" alt="Bread">
                    <div class="card-body text-center">
                        <h5>Fresh Bread</h5>
                        <p>₹100</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card">
                    <img src="./Assets/strawberry pastry.jpeg" class="card-img-top" alt="Pastry">
                    <div class="card-body text-center">
                        <h5>Strawberry Pastry</h5>
                        <p>₹80</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Contact -->
    <div class="container my-5">
        <h2 class="text-center mb-4">Contact Us</h2>

        <form>
            <input type="text" class="form-control mb-3" placeholder="Your Name">
            <input type="phone number" class="form-control mb-3" placeholder="phone number">
            <textarea class="form-control mb-3" rows="4" placeholder="Message"></textarea>
            <button class="btn btn-primary">Send Message</button>
        </form>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 Sweet Bakery. All Rights Reserved.</p>
    </footer>

   
</body>
</html>
