<html>
    <head>
     <title> Element selector </title>


    </head>
    <style>
        h2{
           color: red;
           background-color: lightcoral;
           text-align: center;


        }
    </style>

    <body>
        <h1>An element selector in CSS selects HTML elements using their tag name.</h1>
        <h2>p is the element selector.</h2>
        <h3>It selects all  paragraph elements.</h3>
        <h4>All paragraphs become red.</h4>

        <p>This makes all headings appear in the center.</p>
    </body>
</html>
