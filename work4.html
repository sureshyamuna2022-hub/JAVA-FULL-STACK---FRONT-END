<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Navigation using List</title>
    <style>
        /*----1. simple Navigation bar */
        ul {
            list-style-type: none;
            margin: 0;
            padding: 0;
        }

        
        .simple-nav {
            margin-bottom: 40px;
        }


        /* --- 2. Vertical Navigation Bar Styling --- */
        .vertical-nav {
            width: 200px;
            background-color: #f1f1f1;
        }

        .vertical-nav li a {
            display: block;
            color: #000;
            padding: 8px 16px;
            text-decoration: none;
        }

        /* Hover effect for better user experience */
        .vertical-nav li a:hover {
            background-color: #555;
            color: white;
        }
        
        /* Optional: Style to make the active/first item look like the screenshot */
        .vertical-nav li a.active {
            background-color: #666;
            color: white;
        }
    </style>
</head>
<body>

    <h2>Simple Navigation Bar</h2>
    <ul class="simple-nav">
        <li><a href="home.html">Home</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="about.html">About</a></li>
    </ul>

    <hr>

    <h2>Vertical Navigation Bar</h2>
    <ul class="vertical-nav">
        <li><a href="home.html" class="active">Home</a></li>
        <li><a href="news.html">News</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="about.html">About</a></li>
    </ul>

</body>
</html>
