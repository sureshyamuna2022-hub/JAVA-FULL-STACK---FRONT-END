<html>
    <head>
        <title>Universal-Selector(*)</title>
        <style>
            *{
                color:red;
                background-color:lightgreen;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <h1>In CSS, the universal selector is used to select all HTML elements on a webpage. </h1>
        <p>The symbol for the universal selector is:*</p>

        <h3>This code changes the text color of every element in the webpage to red </h3>
        <h2>CSS</h2>
        <h4>JS</h4>
        <h5>HTML</h5>
        <h6>Bootstrap</h6>
    </body>
</html>
