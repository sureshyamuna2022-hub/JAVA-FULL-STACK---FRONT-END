<html>
    <head>
        <title> Id element</title>
          <style>
            #demo{
             color: hotpink;
             background-color: lightyellow;


            }
          </style>
    </head>

    <body>
        <p id="demo">An ID selector in CSS selects a specific HTML element using the id attribute and # symbol.</p>
        <p>The paragraph with id="demo" becomes hotpink.</p>
        <p id="demo">An ID should be unique in one webpage.</p>
        <p>One element → one unique ID.</p>




    </body>
</html>
